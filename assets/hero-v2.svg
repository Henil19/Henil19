<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Henil Patel AI research developer profile</title>
  <desc id="desc">Animated research and engineering themed profile banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B16"/>
      <stop offset="0.48" stop-color="#11152B"/>
      <stop offset="1" stop-color="#1B0E2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="avatarBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1400" height="360" rx="30" fill="url(#bg)"/>
  <rect width="1400" height="360" rx="30" fill="url(#grid)"/>
  <circle cx="1260" cy="40" r="150" fill="#8B5CF6" opacity=".08">
    <animate attributeName="r" values="130;165;130" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1110" cy="320" r="130" fill="#22D3EE" opacity=".06">
    <animate attributeName="cx" values="1080;1140;1080" dur="8s" repeatCount="indefinite"/>
  </circle>

  <image href="data:image/jpeg;base64,REPLACE_PHOTO_BASE64" x="24" y="24" width="320" height="312" preserveAspectRatio="xMidYMid slice"/>

  <text x="370" y="92" fill="#94A3B8" font-family="Arial,Helvetica,sans-serif" font-size="16" letter-spacing="3">AI / ML · RESEARCH · ENGINEERING</text>
  <text x="370" y="146" fill="#F8FAFC" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="700">Henil Patel</text>
  <rect x="370" y="165" width="520" height="3" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="360;520;360" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="370" y="208" fill="#CBD5E1" font-family="Arial,Helvetica,sans-serif" font-size="21">Building intelligent systems that can</text>
  <text x="370" y="239" fill="#E2E8F0" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600">retrieve · reason · verify · explain</text>

  <g transform="translate(370 275)">
    <rect width="128" height="38" rx="19" fill="#22D3EE" fill-opacity=".10" stroke="#22D3EE" stroke-opacity=".45"/>
    <text x="64" y="25" text-anchor="middle" fill="#67E8F9" font-family="Arial,Helvetica,sans-serif" font-size="14">RAG</text>
    <rect x="142" width="128" height="38" rx="19" fill="#8B5CF6" fill-opacity=".10" stroke="#8B5CF6" stroke-opacity=".45"/>
    <text x="206" y="25" text-anchor="middle" fill="#C4B5FD" font-family="Arial,Helvetica,sans-serif" font-size="14">Reasoning</text>
    <rect x="284" width="128" height="38" rx="19" fill="#EC4899" fill-opacity=".10" stroke="#EC4899" stroke-opacity=".45"/>
    <text x="348" y="25" text-anchor="middle" fill="#F9A8D4" font-family="Arial,Helvetica,sans-serif" font-size="14">Trust</text>
    <rect x="426" width="128" height="38" rx="19" fill="#34D399" fill-opacity=".10" stroke="#34D399" stroke-opacity=".45"/>
    <text x="490" y="25" text-anchor="middle" fill="#6EE7B7" font-family="Arial,Helvetica,sans-serif" font-size="14">Evaluation</text>
  </g>

  <g transform="translate(970 76)">
    <rect width="390" height="236" rx="26" fill="#050812" stroke="#334155"/>
    <text x="28" y="36" fill="#64748B" font-family="monospace" font-size="13">research_pipeline.exe</text>
    <circle cx="346" cy="28" r="5" fill="#22D3EE" filter="url(#glow)">
      <animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <g font-family="monospace" font-size="14">
      <text x="28" y="75" fill="#67E8F9">01</text><text x="62" y="75" fill="#CBD5E1">question →</text><text x="176" y="75" fill="#A78BFA">plan</text>
      <text x="28" y="112" fill="#67E8F9">02</text><text x="62" y="112" fill="#CBD5E1">retrieve →</text><text x="176" y="112" fill="#C4B5FD">evidence</text>
      <text x="28" y="149" fill="#67E8F9">03</text><text x="62" y="149" fill="#CBD5E1">reason →</text><text x="176" y="149" fill="#F9A8D4">trust</text>
      <text x="28" y="186" fill="#67E8F9">04</text><text x="62" y="186" fill="#CBD5E1">explain →</text><text x="176" y="186" fill="#6EE7B7">answer</text>
    </g>
    <path d="M62 204 C125 176 182 230 242 198 S330 190 360 208" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="7 7">
      <animate attributeName="stroke-dashoffset" from="0" to="-70" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>